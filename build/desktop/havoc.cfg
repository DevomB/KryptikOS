# Kryptik's havoc: every terminal reads it, zone 0's chrome and each zone's,
# unless the user has a havoc.cfg of their own (build/patches/havoc-0.7.0).
# No [child] section: a terminal started with no program runs /bin/sh.

[window]
# Opaque: nothing behind a terminal shows through it.
opacity=255
margin=no
decorations=auto

[terminal]
rows=24
columns=80
scrollback=2000
scroll to bottom on input=yes

[font]
size=18
# build/recipes/fonts.sh installs this file and checks this line names it.
path=/usr/share/fonts/TTF/DejaVuSansMono.ttf

[bind]
# Copy and paste go through the clipboard of the terminal's zone.
C-S-c=copy
C-S-v=paste
C-S-r=reset
C-S-Delete=hard reset
C-S-Page_Up=scroll up page
C-S-Page_Down=scroll down page
C-S-Home=scroll to top
C-S-End=scroll to bottom

[colors]
# Black and green. Every colour but color0 reads at 4.5:1 or more on the black, and color15
# on color1 too: nano's error bar is bold white on red, and bold takes the bright colours.
foreground = #33ff66
background = #000000
color0  = #000000
color8  = #4a8a5a
color1  = #ee0000
color9  = #ff7a7a
color2  = #169c3c
color10 = #66ff8c
color3  = #e0c000
color11 = #ffe94d
color4  = #5c8aff
color12 = #8fb0ff
color5  = #c050e0
color13 = #ff80ff
color6  = #00b8b8
color14 = #5ff5f5
color7  = #33ff66
color15 = #ffffff
