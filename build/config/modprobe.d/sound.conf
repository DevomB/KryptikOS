# The HD Audio codec drivers, loaded ahead of the controller: the kernel cannot
# load them itself (STATIC_USERMODEHELPER), and a codec binds only to a driver
# loaded when snd-hda-intel probes it. Stage 05 holds this list to the codec
# drivers build/config/kernel/boot.fragment builds, both ways.
softdep snd-hda-intel pre: snd-hda-codec-generic \
	snd-hda-codec-alc269 snd-hda-codec-alc662 snd-hda-codec-alc882 \
	snd-hda-codec-conexant snd-hda-codec-senarytech snd-hda-codec-idt \
	snd-hda-codec-cs420x snd-hda-codec-cs421x snd-hda-codec-cs8409 \
	snd-hda-codec-hdmi snd-hda-codec-simplehdmi snd-hda-codec-intelhdmi \
	snd-hda-codec-atihdmi snd-hda-codec-nvhdmi
