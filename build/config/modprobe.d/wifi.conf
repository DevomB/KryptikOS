# What a Wi-Fi driver would load later by request_module, which the kernel cannot run here
# (STATIC_USERMODEHELPER, with no helper), loaded with the driver instead:
# - Intel's op modes: iwlwifi starts a card under its op mode whenever that registers.
# - The QRTR socket family that Qualcomm's QMI opens before the card's link is up, which
#   nothing else loads.
# - Broadcom's vendor code, which brcmfmac asks for once its firmware is in.
softdep iwlwifi post: iwlmvm iwlmld
softdep ath11k pre: qrtr
softdep ath12k pre: qrtr
softdep brcmfmac post: brcmfmac-wcc brcmfmac-cyw brcmfmac-bca
