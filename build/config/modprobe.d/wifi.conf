# What a Wi-Fi driver would load later by request_module, which the kernel cannot run here
# (STATIC_USERMODEHELPER, with no helper), loaded with the driver instead. One softdep line per
# module: kmod reads only the first line that names it.
# - Intel's op modes: iwlwifi starts a card under its op mode whenever that registers.
# - For Qualcomm's ath11k and ath12k: the QRTR socket family their QMI opens before the card's
#   link is up, and the michael_mic cipher they allocate by name for TKIP keys. Without the
#   first the card never starts; without the second it scans but never joins.
# - Broadcom's vendor code, which brcmfmac asks for once its firmware is in. Best effort: it
#   loads just after brcmfmac and so before the attach that asks for it, but nothing holds the
#   attach back, and a card whose attach comes first stays down.
softdep iwlwifi post: iwlmvm iwlmld
softdep ath11k pre: qrtr michael_mic
softdep ath12k pre: qrtr michael_mic
softdep brcmfmac post: brcmfmac-wcc brcmfmac-cyw brcmfmac-bca
