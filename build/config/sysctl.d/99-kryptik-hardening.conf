# Runtime hardening sysctls; the reasons are in docs/hardening.md.

# --- kernel information leaks ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3
kernel.perf_event_paranoid = 3
# No kernel.kexec_load_disabled: CONFIG_KEXEC is off, so the key does not exist.

# --- ptrace: disabled entirely after boot ---
kernel.yama.ptrace_scope = 3

# --- eBPF: not built (CONFIG_BPF_SYSCALL is off), so its sysctls do not exist ---

# --- ASLR: maximum entropy on x86-64 ---
kernel.randomize_va_space = 2
vm.mmap_rnd_bits = 32
# No vm.mmap_rnd_compat_bits: no 32-bit programs, CONFIG_IA32_EMULATION is off.

# --- userfaultfd, a heap-grooming primitive, is not built; its sysctl does not exist ---

# --- hardened_malloc's guard pages are mappings; the default 65530 is too few ---
vm.max_map_count = 1048576

# --- filesystem symlink/hardlink races ---
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# --- network hygiene (the `net` zone carries all real traffic) ---
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# --- core dumps could hold zone secrets: CONFIG_COREDUMP is off; suid_dumpable is a backstop ---
