name: CI

# Evidence for the declared-columns change, not for merge: the base branch's
# tools and this branch's, run side by side on the same sources.
on:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    name: Declared columns against the base branch
    runs-on: ubuntu-latest
    env:
      KRYPTIK_SOURCES: /mnt/kryptik/sources
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NO_COLOR: 1
      # Rows the second commit changes on purpose.
      CHANGED: '^(elfutils|cmake|cmake-bin|nano)$'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: The base branch beside this one
        run: |
          sudo mkdir -p /mnt/kryptik && sudo chown "$(id -u):$(id -g)" /mnt/kryptik
          git worktree add ../before "origin/${{ github.base_ref }}"
          echo "before: $(git -C ../before log --oneline -1)"
          echo "after:  $(git log --oneline -1 HEAD^2 2>/dev/null || git log --oneline -1)"

      - name: --list, the first three fields
        run: |
          (cd ../before && ./tools/fetch-sources.sh --list) > /tmp/before.list
          ./tools/fetch-sources.sh --list > /tmp/after.list
          if diff <(awk '{print $1, $2, $3}' /tmp/before.list) <(awk '{print $1, $2, $3}' /tmp/after.list); then
            echo "IDENTICAL: name, version and URL of all $(wc -l < /tmp/after.list) rows"
          else
            echo "DIFFERENT (above)"
          fi
          echo; echo "fields per row after: $(awk '{print NF}' /tmp/after.list | sort -u | tr '\n' ' ')"
          echo; awk '{print $1, $4, $5}' /tmp/after.list | column -t

      - name: The currency survey, the first four columns
        run: |
          (cd ../before && ./tools/check-source-currency.sh --tsv) > /tmp/before.tsv
          ./tools/check-source-currency.sh --tsv > /tmp/after.tsv
          echo "rows: before $(wc -l < /tmp/before.tsv), after $(wc -l < /tmp/after.tsv)"
          keep() { awk -F'\t' -v c="$CHANGED" '$1 !~ c {print $1 "\t" $2 "\t" $3 "\t" $4}' "$1"; }
          if diff <(keep /tmp/before.tsv) <(keep /tmp/after.tsv); then
            echo "IDENTICAL: name, pin, newest and status of every row but the four changed on purpose"
          else
            echo "DIFFERENT (above)"
          fi
          echo; echo "the four changed on purpose, before then after:"
          awk -F'\t' -v c="$CHANGED" '$1 ~ c' /tmp/before.tsv /tmp/after.tsv
          echo; echo "consulted, where it changed:"
          awk -F'\t' 'NR == FNR { c[$1] = $5; next } ($1 in c) && c[$1] != $5 { print $1 "\n    " c[$1] "\n    " $5 }' \
              /tmp/before.tsv /tmp/after.tsv
          echo; echo "the survey after:"; column -t -s "$(printf '\t')" /tmp/after.tsv

      - name: Upstream sources (cached by sources.lock)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /mnt/kryptik/sources
          key: sources-${{ hashFiles('sources.lock') }}
          restore-keys: |
            sources-

      - name: Fetch and verify the sources
        run: make sources

      - name: verify-signatures.sh, class by class
        run: |
          # Each run fetches its own signatures, so neither reads the other's.
          rm -rf "${KRYPTIK_SOURCES}/.signatures"
          (cd ../before && ./tools/verify-signatures.sh --report=/tmp/before-sig.tsv) > /tmp/before-sig.log 2>&1 || true
          rm -rf "${KRYPTIK_SOURCES}/.signatures"
          ./tools/verify-signatures.sh --report=/tmp/after-sig.tsv > /tmp/after-sig.log 2>&1 || true
          echo "rows: before $(wc -l < /tmp/before-sig.tsv), after $(wc -l < /tmp/after-sig.tsv)"
          if diff <(cut -f1,2 /tmp/before-sig.tsv) <(cut -f1,2 /tmp/after-sig.tsv); then
            echo "IDENTICAL: every source's class"
          else
            echo "DIFFERENT (above)"
          fi
          echo; echo "details that changed:"
          awk -F'\t' 'NR == FNR { d[$1] = $3; next } d[$1] != $3 { print $1 "\n    " d[$1] "\n    " $3 }' \
              /tmp/before-sig.tsv /tmp/after-sig.tsv
          echo; echo "summary before:"; sed -n '/Summary/,$p' /tmp/before-sig.log | head -8
          echo; echo "summary after:"; sed -n '/Summary/,$p' /tmp/after-sig.log | head -8

      - name: verify-provenance.sh, assertion by assertion
        run: |
          (cd ../before && ./tools/verify-provenance.sh --report=/tmp/before-prov.tsv) > /tmp/before-prov.log 2>&1 || true
          ./tools/verify-provenance.sh --report=/tmp/after-prov.tsv > /tmp/after-prov.log 2>&1 || true
          if diff <(cut -f1,2 /tmp/before-prov.tsv | sort) <(cut -f1,2 /tmp/after-prov.tsv | sort); then
            echo "IDENTICAL: every source's assertions and results ($(wc -l < /tmp/after-prov.tsv))"
          else
            echo "DIFFERENT (above)"
          fi
          echo; tail -12 /tmp/after-prov.log
