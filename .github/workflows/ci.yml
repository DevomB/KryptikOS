name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. The kernel EOL check is the reason this runs on a timer: a pinned
    # kernel does not change, but its support status does. Kryptik shipped an
    # EOL kernel once already (ADR-009) and a scheduled check is what makes
    # that a caught error rather than a discovered one.
    - cron: '0 6 * * 1'

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the check is over the whole history.
          fetch-depth: 0

      - name: Every commit is DevomB <Devom.hb@yahoo.com>
        run: |
          # GitHub attributes a commit to whichever account registered its
          # email, and devom.b@yahoo.com is registered to DBs-Server-Service.
          # A share of this repository displayed as that account's work until
          # the history was rewritten on 2026-09-15. This goes red the moment
          # one such commit comes back, anywhere in the history.
          #
          # On a pull request the checkout is GitHub's synthetic merge of the
          # branch into main, authored through a noreply address and
          # committed by GitHub itself. It is not a commit of this repository
          # and never reaches main as it is; the branch's own history is what
          # is checked there.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./tools/check-commit-identity.sh "${{ github.event.pull_request.head.sha }}"
          else
            ./tools/check-commit-identity.sh --all
          fi

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax check every script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './build/work/*')
          exit $fail

      - name: Tool fixture suites
        run: |
          # Ten offline suites existed and exactly one of them ran in CI. They
          # need no network and no build, so there is no reason for any of them
          # to be absent: each one is the regression net for a tool that was
          # found reporting more than it had established.
          # Exit 77 means "cannot run here" - the autotools convention. One of
          # these suites chroots into a built sysroot and needs root plus that
          # sysroot, neither of which exists on a CI runner. Skipped is listed
          # separately and is NOT counted as a pass: a suite that did not run
          # has established nothing, and the whole point of this job is that
          # nothing here reports more than it has established.
          fail=0
          skipped=""
          for t in tools/test-*.sh; do
            echo "=== $t"
            # The step's shell is `bash -e`: a bare non-zero exit ends the
            # step before rc is read, so the first suite that answered 77 took
            # the whole step down with "exit code 77" once nothing before it
            # failed. Capture the status without letting -e see it.
            "$t" && rc=0 || rc=$?
            if [ "$rc" -eq 77 ]; then
              echo "  SKIPPED: $t"
              skipped="$skipped $t"
            elif [ "$rc" -ne 0 ]; then
              echo "  FAILED: $t"
              fail=1
            fi
          done
          if [ -n "$skipped" ]; then
            echo
            echo "did not run (not passes):$skipped"
          fi
          exit $fail

      - name: Shellcheck
        # tools/vm/ and the launcher suite were outside this list until now,
        # which left the two largest scripts in the tree ungated - including the
        # one that decides whether a boot passed. Three real warnings came out
        # of adding them.
        run: |
          shellcheck -S warning -x build/lib/common.sh build/stages/*.sh \
            tools/*.sh tools/vm/*.sh compartments/tests/*.sh

      - name: Executable bits are recorded
        run: |
          # NTFS cannot express the POSIX exec bit, so a commit from Windows
          # silently records 100644 and a Linux clone fails before bash runs.
          # Same gap the shellcheck step had: tools/vm/, the test suites and
          # the git hooks were not in this list, and tools/git-hooks/pre-commit
          # was committed 100644 - so git skipped it silently on every commit
          # and the hook has never once run.
          fail=0
          for f in build/stages/*.sh tools/*.sh tools/vm/*.sh \
                   compartments/tests/*.sh tools/git-hooks/*; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "  NOT EXECUTABLE ($mode): $f"
              fail=1
            fi
          done
          exit $fail

      - name: No CRLF in scripts
        run: |
          if grep -rlU $'\r' --include='*.sh' --include='Makefile' . ; then
            echo "CRLF found - scripts will fail on Linux with 'bad interpreter'"
            exit 1
          fi
          echo "no CRLF"

  manifest:
    name: Source manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifest resolves
        run: ./tools/fetch-sources.sh --list

      # The strict provenance gate below hashes the downloaded tarballs
      # against what upstream publishes; without them it reported seven
      # assertions unverified and failed (which was the honest answer, and the
      # reason this step exists). Cached by sources.lock, so a run downloads
      # them only when the manifest changes.
      - name: Upstream sources (cached by sources.lock)
        id: sources
        uses: actions/cache@v5
        with:
          path: sources
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Fetch and verify the sources
        if: steps.sources.outputs.cache-hit != 'true'
        run: make sources

      # Informational, deliberately non-blocking.
      #
      # MIRROR_GNU is ftpmirror.gnu.org, which redirects to a nearby mirror
      # chosen per-request. Individual mirrors go down, rate-limit, or reject
      # requests, and none of that is a defect in this repository - failing the
      # build on it would just train people to ignore red CI.
      #
      # Uses a one-byte ranged GET rather than HEAD: several GNU mirrors answer
      # HEAD with 403 while serving GET fine. Checks curl's exit status instead
      # of parsing %{http_code}, which reports one code per redirect hop and
      # produced nonsense like "302000".
      - name: Every source URL is reachable
        continue-on-error: true
        run: |
          reach() {
            curl -fsSL --range 0-0 --retry 3 --retry-delay 2 \
                 --connect-timeout 20 --max-time 60 -o /dev/null "$1"
          }

          missing=0
          while read -r name ver url; do
            if reach "$url"; then
              echo "  ok        $name $ver"
              continue
            fi
            # Mirror what fetch-sources.sh actually does: fall back to
            # mirrors.kernel.org for GNU packages before giving up.
            fallback="${url/https:\/\/ftpmirror.gnu.org/https://mirrors.kernel.org/gnu}"
            if [ "$fallback" != "$url" ] && reach "$fallback"; then
              echo "  ok        $name $ver  (via fallback mirror)"
            else
              echo "  UNREACHED $name $ver  $url"
              missing=$((missing + 1))
            fi
          done < <(./tools/fetch-sources.sh --list)
          echo
          if [ "$missing" -gt 0 ]; then
            echo "$missing source(s) unreachable this run."
            echo "Usually a transient mirror problem. Investigate only if the"
            echo "same package fails across several runs."
          else
            echo "all sources reachable"
          fi

      - name: Provenance of unsigned sources
        # GH_TOKEN is the whole fix. `gh` IS installed on the runner - it ships
        # in actions/runner-images - but GITHUB_TOKEN is a secret rather than an
        # exported variable, and this step set no GH_TOKEN. So `gh api` exited 4
        # asking for `gh auth login` even against a public repository, the old
        # script counted that as "skipped", and the step passed green for months
        # without ever making the assertion docs/supply-chain.md calls verified.
        #
        # --strict on push and on the weekly schedule, informational on pull
        # requests: secrets.GITHUB_TOKEN is not available to a pull request from
        # a fork, and a gate that cannot run is not a gate. The distinction is
        # written here rather than left for someone to discover from a red X.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull request: informational (no token for fork PRs)"
            ./tools/verify-provenance.sh
          else
            ./tools/verify-provenance.sh --strict
          fi

      - name: Provenance inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One line per source and one assurance class per line. Deliberately
          # no total: a detached GPG signature, a signed tag bound to an archive
          # hash and a publisher checksum are three different strengths of
          # evidence, and a single fraction adds them together as if they were
          # one.
          ./tools/provenance-inventory.sh

      - name: sources.lock covers the manifest
        run: |
          fail=0
          while read -r name ver url; do
            file=$(basename "$url")
            if ! grep -q "  $file\$" sources.lock; then
              echo "  MISSING FROM LOCK: $file"
              fail=1
            fi
          done < <(./tools/fetch-sources.sh --list)
          [ $fail -eq 0 ] && echo "sources.lock covers every manifest entry"
          exit $fail

  compartments:
    name: Compartment layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: kryptikd unit tests
        run: cd compartments/kryptikd && cargo test

      - name: Zone definitions validate
        run: |
          cd compartments/kryptikd && cargo build --quiet
          ./target/debug/kryptikd check --zones ../zones

      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks unprivileged userns creation. Kryptik zones are built
          # on user namespaces, so the test cannot run without this.
          #
          # Note the irony worth being explicit about: Ubuntu restricts this
          # BECAUSE unprivileged userns is a known LPE vector. Kryptik reaches
          # the same conclusion from the other direction - hardened.fragment
          # sets CONFIG_USER_NS_UNPRIVILEGED=n, because kryptikd creates zones
          # with privilege and nothing inside a zone ever needs to.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "userns check:"
          unshare --user --map-root-user id -u

      - name: kryptikd builds for musl
        run: |
          # The developer VM installs a static kryptikd into an initramfs, and
          # the musl target is where a glibc-only assumption shows up. It has
          # already caught one: ioctl's request argument is c_ulong in glibc's
          # binding and c_int in musl's.
          rustup target add x86_64-unknown-linux-musl
          cd compartments/kryptikd
          cargo build --release --target x86_64-unknown-linux-musl
          cargo test --target x86_64-unknown-linux-musl

      - name: Isolation exit test (the primitives)
        run: |
          cd compartments/kryptikd && cargo build --quiet
          cd ../.. && ./compartments/tests/adversarial.sh

      - name: Real-launcher suite (the launch path itself)
        run: |
          # adversarial.sh drives the primitives with unshare(1); this drives
          # `kryptikd run`. They are different claims - the seccomp filter is
          # installed at the last step of the child, and an ordering regression
          # there would leave zones unfiltered while the primitive test kept
          # passing. A change to the zone path has to pass both.
          #
          # This runs unprivileged here. Group K (the privileged launch path)
          # and group M (cgroup limits) report NOT RUN on a runner and are
          # covered by tools/vm/ instead - the suite prints them by name and
          # exits "PASSED WITH GAPS" rather than "PASSED", so the gap is
          # visible in the log rather than absent from it.
          cd compartments/kryptikd && cargo build --quiet
          cd ../.. && ./compartments/tests/launcher.sh | tee /tmp/launcher.out
          exit "${PIPESTATUS[0]}"

      - name: The runner must ADMIT what it could not test
        run: |
          # THE TIER GUARD.
          #
          # Three kinds of evidence exist in this repository and they are not
          # interchangeable:
          #
          #   component    - unit tests and tool fixtures. No kernel features.
          #   developer    - the launcher suite on THIS runner's kernel, which
          #                  is a stock Ubuntu one, unprivileged.
          #   target       - the same suite as root, in a VM, with the userns
          #                  restriction on. CI CANNOT PRODUCE THIS. It needs
          #                  a disposable VM and it lives in tools/vm/.
          #
          # A green tick here therefore never means the privileged path works.
          # The suite already prints its own gaps and exits "PASSED WITH GAPS"
          # rather than "PASSED" - this step fails if it ever stops doing so on
          # a runner, because a clean pass here would mean the checks that need
          # root either ran unprivileged (and proved nothing) or stopped
          # reporting themselves. Both are worse than a red tick.
          if ! grep -q 'PASSED WITH GAPS' /tmp/launcher.out; then
            echo "::error::The launcher suite reported a clean pass on a CI runner."
            echo "Group K (privileged launch) and group M (cgroup limits) cannot run"
            echo "here. If they are no longer reported as NOT RUN, they are either"
            echo "running vacuously or have been dropped. Neither is a pass."
            grep -E 'passed,|not run' /tmp/launcher.out || true
            exit 1
          fi
          echo "The suite reported its gaps, as it must on a runner:"
          sed -n '/not run (mandatory gaps/,/^$/p' /tmp/launcher.out

      - name: What this CI run did and did not establish
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### What a green run here means

          | tier | established here? |
          |---|---|
          | component (unit tests, tool fixtures) | yes |
          | developer host (this runner's kernel, unprivileged) | yes |
          | **target kernel (root, VM, userns restricted)** | **no — needs `tools/vm/`** |

          The privileged launch path, the cgroup limits, the zone lifecycle
          under root and the boot itself are validated by `tools/vm/run-qemu.sh`
          and `tools/vm/boot-smoke.sh` against a disposable VM. Nothing in this
          workflow can stand in for that, and a green tick here is not evidence
          about it.
          SUMMARY

      - name: The user-facing command
        run: |
          # `kryptik` is what a person types; kryptikd is what it calls. A
          # wrapper's whole job is convenience, and convenience is how a safety
          # property gets lost - so this suite mostly checks that it did not
          # become convenient in the wrong place: it must not start a zone that
          # claims encryption this build cannot deliver, must not execute its
          # own config file, and must not offer commands for things that do not
          # work.
          #
          # Named separately from the launcher suite rather than folded into
          # it: these are different claims about different programs, and a
          # single green tick over both would hide which one failed.
          ./compartments/tests/cli.sh

      - name: Update, rollback and recovery (end to end)
        run: |
          # tools/test-apply-update.sh already proves the byte-level property:
          # a target is never a mixture of two releases. This asks the question
          # that one cannot - after the update, does the system DO something
          # different? - by installing a real Kryptik tree and then running the
          # INSTALLED kryptikd against the INSTALLED zone files.
          #
          # It also kills the update at ten points across a padded payload and
          # requires that every outcome is a complete, signed, working release,
          # recovered by the command the tool itself documents for that state.
          #
          # 77 means a dependency is missing (ssh-keygen, or no built
          # kryptikd). That is reported as "did not run", never as a pass.
          set +e
          ./compartments/tests/update.sh
          rc=$?
          set -e
          if [ "$rc" = 77 ]; then
            echo "::warning::update.sh did not run (missing dependency); this CI run establishes nothing about updates"
            exit 0
          fi
          exit "$rc"

  kernel:
    name: Kernel currency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every pinned series with a published support window must still be
      # inside it. OpenSSL 3.3 went out of support on 2026-04-09 and Kryptik
      # shipped 3.3.1 for five months after; the tool knew and nothing ran it.
      - name: Pinned series are supported upstream
        run: ./tools/check-support-status.sh --strict

      - name: Pinned kernel is longterm and not EOL
        run: ./tools/check-kernel-eol.sh

      - name: Kernel config fragments validate against pinned source
        run: |
          # Downloads the pinned kernel (~150MB) and the hardened patch to
          # check every fragment symbol actually exists. Symbols get renamed
          # and removed between releases, and merge_config.sh drops unknown
          # ones silently - so a stale fragment ships a kernel that looks
          # hardened and is not.
          mkdir -p sources
          # Match the exact package names: a bare '^linux ' would also catch
          # the linux-hardened row.
          ./tools/fetch-sources.sh --list \
            | awk '$1 == "linux" || $1 == "linux-hardened" {print $3}' \
            | while read -r u; do
                echo "fetching $(basename "$u")"
                curl -fL --no-progress-meter -o "sources/$(basename "$u")" "$u"
              done
          ./tools/validate-kernel-config.sh
          ./tools/validate-kernel-config.sh --hardened
          # The boot fragment too. It went unchecked here, and a misspelt
          # driver symbol (CONFIG_TG3 for CONFIG_TIGON3) was caught only by
          # acceptance, hours into a Distro run.
          ./tools/validate-kernel-config.sh --boot
