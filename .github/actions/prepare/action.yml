name: Prepare the runner
description: Work directories on the large disk, the host packages every Distro job uses, and the upstream sources.
inputs:
  vm:
    description: Also let the runner start VMs (KVM, and virt-fw-vars for the variable stores).
    default: 'false'
  sources:
    description: The root's upstream sources, cached by sources.lock. Either fetches what the cache lacks; 'fetch' also saves the set.
    default: ''
  image-sources:
    description: The software images' sources too, a cache of their own keyed by build/images/sources.lock; 'fetch' or 'restore' as for sources.
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # A full disk kills the runner unreported: write under /mnt, delete the SDKs in the background.
        sudo mkdir -p /mnt/kryptik
        sudo chown "$(id -u):$(id -g)" /mnt/kryptik
        mkdir -p "$KRYPTIK_WORK" "$KRYPTIK_SOURCES" "$KRYPTIK_OUT" /mnt/kryptik/tmp /mnt/kryptik/cargo
        echo "TMPDIR=/mnt/kryptik/tmp" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=/mnt/kryptik/cargo" >> "$GITHUB_ENV"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL < /dev/null > /dev/null 2>&1 &
        df -h / /mnt | tail -2
        sudo apt-get update -qq && sudo apt-get install -y -qq $HOST_PACKAGES
        # 00-host-check refuses dash as /bin/sh.
        sudo ln -sf /usr/bin/bash /bin/sh

    - if: inputs.vm == 'true'
      shell: bash
      run: |
        sudo pip install --break-system-packages virt-firmware==26.9
        virt-fw-vars --help > /dev/null
        # Only root may open /dev/kvm on a hosted runner; without it every VM falls back to TCG and times out.
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -la /dev/kvm

    # The root's set, keyed by its lock alone. images/, the software images' sources, has a cache of
    # its own and is set aside while this one is saved: a browser bump then copies none of the root's
    # set, and a root bump none of theirs. The path is the one it always had, so earlier sets restore.
    - if: inputs.sources != ''
      id: sources
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources
        key: sources-v3-${{ hashFiles('sources.lock') }}
        # A changed lock restores the previous set; every file is still hashed against the lock.
        restore-keys: sources-

    - if: inputs.image-sources != ''
      id: image_sources
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources/images
        key: image-sources-v1-${{ hashFiles('build/images/sources.lock') }}
        restore-keys: image-sources-v1-

    # A cache evicted since the build job is fetched again, not taken as gone.
    - if: (inputs.sources != '' && steps.sources.outputs.cache-hit != 'true') || (inputs.image-sources != '' && steps.image_sources.outputs.cache-hit != 'true')
      shell: bash
      env:
        MODE: ${{ inputs.sources }}
        IMAGES: ${{ inputs.image-sources }}
      run: |
        if [[ -n "$IMAGES" ]]; then make sources; else ./tools/fetch-sources.sh --root; fi
        ./tools/prune-sources.sh
        # Fetches the signatures into the saved set for CI's gate; this pass is not the verdict.
        [[ "$MODE" != fetch ]] || ./tools/verify-signatures.sh > /dev/null 2>&1 || true

    # Saved now rather than at the end, so a job that fails later does not refetch the new files.
    - if: inputs.sources == 'fetch' && steps.sources.outputs.cache-hit != 'true'
      shell: bash
      run: if [[ -d /mnt/kryptik/sources/images ]]; then mv /mnt/kryptik/sources/images /mnt/kryptik/images-aside; fi

    - if: inputs.sources == 'fetch' && steps.sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources
        key: sources-v3-${{ hashFiles('sources.lock') }}

    - if: always() && inputs.sources == 'fetch' && steps.sources.outputs.cache-hit != 'true'
      shell: bash
      run: if [[ -d /mnt/kryptik/images-aside ]]; then mv /mnt/kryptik/images-aside /mnt/kryptik/sources/images; fi

    - if: inputs.image-sources == 'fetch' && steps.image_sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources/images
        key: image-sources-v1-${{ hashFiles('build/images/sources.lock') }}
