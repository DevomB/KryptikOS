name: Prepare the runner
description: Work directories on the large disk, the host packages every Distro job uses, and the upstream sources.
inputs:
  vm:
    description: Also let the runner start VMs (KVM, and virt-fw-vars for the variable stores).
    default: 'false'
  sources:
    description: The upstream sources, cached by sources.lock. 'fetch' also fetches what the cache lacks and saves the set; 'restore' only restores it.
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Everything the build or a test writes, temporary files and Rust
        # targets included, goes under /mnt, and the image's SDKs are deleted:
        # a full disk kills the runner before it writes a report. Deleting them
        # takes minutes, so it runs on in the background, detached from the
        # step's output; nothing needs the room that soon.
        sudo mkdir -p /mnt/kryptik
        sudo chown "$(id -u):$(id -g)" /mnt/kryptik
        mkdir -p "$KRYPTIK_WORK" "$KRYPTIK_SOURCES" "$KRYPTIK_OUT" /mnt/kryptik/tmp /mnt/kryptik/cargo
        echo "TMPDIR=/mnt/kryptik/tmp" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=/mnt/kryptik/cargo" >> "$GITHUB_ENV"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL < /dev/null > /dev/null 2>&1 &
        df -h / /mnt | tail -2
        sudo apt-get update -qq && sudo apt-get install -y -qq $HOST_PACKAGES
        # 00-host-check refuses dash as /bin/sh.
        sudo ln -sf /usr/bin/bash /bin/sh

    - if: inputs.vm == 'true'
      shell: bash
      run: |
        sudo pip install --break-system-packages virt-firmware==26.9
        virt-fw-vars --help > /dev/null
        # /dev/kvm exists on a hosted runner but only root may open it; without
        # it every VM falls back to TCG and runs into its timeout.
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -la /dev/kvm

    - if: inputs.sources != ''
      id: sources
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources
        key: sources-${{ hashFiles('sources.lock') }}
        # A changed lock restores the previous set and fetches only what is
        # new; every file is still hashed against the lock.
        restore-keys: ${{ inputs.sources == 'fetch' && 'sources-' || '' }}

    - if: inputs.sources == 'fetch' && steps.sources.outputs.cache-hit != 'true'
      shell: bash
      run: |
        make sources
        ./tools/prune-sources.sh

    # Saved as soon as the set is verified, not when the job ends: a job that
    # fails later would otherwise fetch the lock's new files again next time.
    - if: inputs.sources == 'fetch' && steps.sources.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /mnt/kryptik/sources
        key: sources-${{ hashFiles('sources.lock') }}
