# A zone's programs play and record through zone 0's mixer (docs/design/laptop.md), by the
# plugin libasound_module_pcm_kryptik.so; plug converts to the one format the mixer takes.
# Zone 0's mixer opens its cards by name and never this default.
pcm.!default {
	type plug
	slave.pcm "kryptik"
}

pcm.kryptik {
	type kryptik
	hint.description "Zone 0's mixer"
}
