# vault — long-term secrets. The most restricted zone in the system.

[zone]
name        = "vault"
description = "Keys, password store, secrets. No network stack."

[network]
# "none": a network namespace with only loopback, so there is no interface to route through.
mode = "none"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/vault.luks"
# No USB stick is ever given to this zone: what holds the keys reads no filesystem anyone
# may have written, and copies nothing out to one.
removable = false

[policy]
seccomp  = "policy/vault.seccomp"

[limits]
memory_max = "2G"
pids_max   = 128

[sound]
# No socket to zone 0's mixer: secrets have no use for sound, and a sound is a way out to the
# room that nothing mediates.
play = false

[camera]
# Never granted the camera: secrets have no use for it, and what it sees is the room.
use = false

[identity]
# Root inside maps to host uid/gid 393216, nobody to 458750; fixed, never derived from zone order.
uid_base = 393216

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#9e80ac"
# The pattern is checked, but nothing draws it.
border_pattern = "double"
glyph          = "★"
label          = "VAULT"
