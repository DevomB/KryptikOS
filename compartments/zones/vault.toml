# vault — long-term secrets. The most restricted zone in the system.

[zone]
name        = "vault"
description = "Keys, password store, secrets. No network stack."

[network]
# "none": a network namespace with only loopback; there is no interface to
# route through.
mode = "none"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/vault.luks"

[policy]
seccomp  = "policy/vault.seccomp"

[limits]
memory_max = "2G"
pids_max   = 128

[identity]
# Host uid/gid range: root inside maps to 393216, nobody to 458750. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 393216

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# backs up colour for users who cannot tell colours apart. Pick colours with
# `zoneid propose`; `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#9e80ac"
border_pattern = "double"
glyph          = "★"
label          = "VAULT"
