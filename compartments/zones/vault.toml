# vault — long-term secrets. The most restricted zone in the system.

[zone]
name        = "vault"
description = "Keys, password store, secrets. No network stack."

[network]
# "none" means this zone gets a network namespace containing ONLY loopback.
# Not a firewall rule that could be misconfigured - there is no interface to
# route through and no path to one.
mode = "none"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/vault.luks"

[policy]
seccomp  = "policy/vault.seccomp"

[limits]
memory_max = "2G"
pids_max   = 128

[identity]
# Fixed host uid/gid range for this zone: root inside maps to 393216,
# nobody to 458750. Never derived from zone order; see docs/design/privileged-launch.md.
uid_base = 393216

[ui]
# Identity in four channels (compositor/zoneid, `zoneid explain`): the
# colour is from `zoneid propose` (every pair of shipped zones differs by
# dE00 >= 15 under every vision model, 3:1 against both backgrounds);
# the pattern, glyph and label are what remain for a user who cannot see
# the colour difference. Every zone has a distinct value in each.
border_color   = "#9e80ac"
border_pattern = "double"
glyph          = "★"
label          = "VAULT"
