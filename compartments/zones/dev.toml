# dev — Toolchains and build environments.

[zone]
name        = "dev"
description = "Toolchains and build environments."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/dev.luks"

[policy]
seccomp  = "policy/dev.seccomp"

[limits]
memory_max = "12G"
pids_max   = 1024

[identity]
# Root inside maps to host uid/gid 131072, nobody to 196606; fixed, never derived from zone order.
uid_base = 131072

[transfer]
# dev may hand files to work, one way, after a confirmation in zone 0 (docs/design/broker.md).
to = "work"

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#7f623d"
# The pattern is checked, but nothing draws it.
border_pattern = "dotted"
glyph          = "◆"
label          = "DEV"
