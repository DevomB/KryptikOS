# dev — Toolchains and build environments.

[zone]
name        = "dev"
description = "Toolchains and build environments."

[network]
mode = "routed"

[storage]
mode      = "encrypted"
volume    = "/var/lib/kryptik/volumes/dev.luks"
unlock    = "on-start"
wipe_keys = "on-stop"

[policy]
seccomp  = "policy/dev.seccomp"

[limits]
memory_max = "12G"
pids_max   = 1024

[identity]
# Host uid/gid range: root inside maps to 131072, nobody to 196606. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 131072

[transfer]
# dev may hand files to work, one way, through the broker and a confirmation
# in zone 0 (docs/design/broker.md). No other shipped zone sends anything.
to = "work"

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# backs up colour for users who cannot tell colours apart. Pick colours with
# `zoneid propose`; `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#7f623d"
border_pattern = "dotted"
glyph          = "◆"
label          = "DEV"
