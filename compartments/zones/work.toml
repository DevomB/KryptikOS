# work — Daily productivity.

[zone]
name        = "work"
description = "Daily productivity."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/work.luks"

[policy]
seccomp  = "policy/work.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Fixed host uid/gid range for this zone: root inside maps to 458752,
# nobody to 524286. Never derived from zone order; see docs/design/privileged-launch.md.
uid_base = 458752

[ui]
# Identity in four channels (compositor/zoneid, `zoneid explain`): the
# colour is from `zoneid propose` (every pair of shipped zones differs by
# dE00 >= 15 under every vision model, 3:1 against both backgrounds);
# the pattern, glyph and label are what remain for a user who cannot see
# the colour difference. Every zone has a distinct value in each.
border_color   = "#2d60d1"
border_pattern = "solid"
glyph          = "■"
label          = "WORK"
