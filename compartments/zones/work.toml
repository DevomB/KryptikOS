# work — Daily productivity.

[zone]
name        = "work"
description = "Daily productivity."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/work.luks"

[policy]
seccomp  = "policy/work.seccomp"

[limits]
memory_max = "8G"
# Threads count too: Firefox runs a process for each site, each with dozens of threads.
pids_max   = 4096

[identity]
# Root inside maps to host uid/gid 458752, nobody to 524286; fixed, never derived from zone order.
uid_base = 458752

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#2d60d1"
# The pattern is checked, but nothing draws it.
border_pattern = "solid"
glyph          = "■"
label          = "WORK"

[software]
# The browser, and the toolkit it is built over (docs/design/software-delivery.md); the call its
# content sandbox needs is granted in the zone's policy.
images = "browser toolkit"

[desktop]
# Video in the browser, a call or a talk: a window of this zone may hold off the lock and the
# blanking while it is shown and has the keyboard, for four hours from the last key or button
# (docs/design/laptop.md).
hold_awake = true

[clock]
# Zone 0's time zone, as it is when the zone starts; a zone without this line keeps UTC.
local = true
