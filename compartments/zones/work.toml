# work — Daily productivity.

[zone]
name        = "work"
description = "Daily productivity."

[network]
mode = "routed"

[storage]
mode      = "encrypted"
volume    = "/var/lib/kryptik/volumes/work.luks"
unlock    = "on-start"
wipe_keys = "on-stop"

[policy]
seccomp  = "policy/work.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Host uid/gid range: root inside maps to 458752, nobody to 524286. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 458752

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# backs up colour for users who cannot tell colours apart. Pick colours with
# `zoneid propose`; `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#2d60d1"
border_pattern = "solid"
glyph          = "■"
label          = "WORK"
