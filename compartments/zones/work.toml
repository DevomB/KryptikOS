# work — Daily productivity.

[zone]
name        = "work"
description = "Daily productivity."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/work.luks"

[policy]
seccomp  = "policy/work.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Root inside maps to host uid/gid 458752, nobody to 524286; fixed, never derived from zone order.
uid_base = 458752

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#2d60d1"
# The pattern is checked, but nothing draws it.
border_pattern = "solid"
glyph          = "■"
label          = "WORK"
