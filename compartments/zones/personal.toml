# personal — Separate identity, separate cookies, separate everything.

[zone]
name        = "personal"
description = "Separate identity, separate cookies, separate everything."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/personal.luks"

[policy]
seccomp  = "policy/personal.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Root inside maps to host uid/gid 262144, nobody to 327678; fixed, never derived from zone order.
uid_base = 262144

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#009b79"
# The pattern is checked, but nothing draws it.
border_pattern = "dashed"
glyph          = "●"
label          = "PERSONAL"
