# personal — Separate identity, separate cookies, separate everything.

[zone]
name        = "personal"
description = "Separate identity, separate cookies, separate everything."

[network]
mode = "routed"

[storage]
mode   = "encrypted"
volume = "/var/lib/kryptik/volumes/personal.luks"

[policy]
seccomp  = "policy/personal.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Host uid/gid range: root inside maps to 262144, nobody to 327678. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 262144

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# backs up colour for users who cannot tell colours apart. Pick colours with
# `zoneid propose`; `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#009b79"
border_pattern = "dashed"
glyph          = "●"
label          = "PERSONAL"
