# personal — Separate identity, separate cookies, separate everything.

[zone]
name        = "personal"
description = "Separate identity, separate cookies, separate everything."

[network]
mode = "routed"

[storage]
mode      = "encrypted"
volume    = "/var/lib/kryptik/volumes/personal.luks"
unlock    = "on-start"
wipe_keys = "on-stop"

[policy]
seccomp  = "policy/personal.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Fixed host uid/gid range for this zone: root inside maps to 262144,
# nobody to 327678. Never derived from zone order; see docs/design/privileged-launch.md.
uid_base = 262144

[ui]
# Identity in four channels (compositor/zoneid, `zoneid explain`): the
# colour is from `zoneid propose` (every pair of shipped zones differs by
# dE00 >= 15 under every vision model, 3:1 against both backgrounds);
# the pattern, glyph and label are what remain for a user who cannot see
# the colour difference. Every zone has a distinct value in each.
border_color   = "#009b79"
border_pattern = "dashed"
glyph          = "●"
label          = "PERSONAL"
