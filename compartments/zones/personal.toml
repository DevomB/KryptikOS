# personal — Separate identity, separate cookies, separate everything.

[zone]
name        = "personal"
description = "Separate identity, separate cookies, separate everything."

[network]
mode = "routed"

[storage]
mode      = "encrypted"
volume    = "/dev/kryptik/personal"
unlock    = "on-start"
wipe_keys = "on-stop"

[policy]
seccomp  = "policy/personal.seccomp"

[limits]
memory_max = "8G"
pids_max   = 1024

[identity]
# Fixed host uid/gid range for this zone: root inside maps to 262144,
# nobody to 327678. Never derived from zone order; see docs/design/01.
uid_base = 262144

[ui]
border_color = "#7a4fa3"
