# net — the only zone on the physical NIC; the most exposed, so its storage is ephemeral.

[zone]
name        = "net"
description = "Sole holder of a physical network route."

[network]
# Routed zones reach the network through a veth into kryptik0, this zone's bridge.
mode = "nic"
# Taken from zone 0 at start: "*" is every PCI, USB or platform interface, "eth0" only that one.
nic = "*"

[storage]
mode = "ephemeral"
# Required for ephemeral: $HOME is a tmpfs, which could otherwise fill host memory.
size = "512M"

[policy]
seccomp  = "policy/net.seccomp"

[limits]
memory_max = "1G"
pids_max   = 256
# One CPU's worth of time: a flaw in what parses the network must not take the machine.
cpu_max    = "100%"

[identity]
# Root inside maps to host uid/gid 196608, dhcpcd's user (100) to 196708 and nobody to 262142;
# fixed, never derived from zone order.
uid_base = 196608

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#686573"
# The pattern is checked, but nothing draws it.
border_pattern = "notched"
glyph          = "◐"
label          = "NET"
