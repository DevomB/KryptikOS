# net — the only zone with a route to the physical NIC; every other zone
# reaches the network through it. It is the most exposed zone, so its storage
# is ephemeral (docs/architecture.md, "Known weaknesses").

[zone]
name        = "net"
description = "Sole holder of a physical network route."

[network]
mode = "nic"
# Zones with mode = "routed" get a veth into this bridge.
bridge = "kryptik0"
# Interfaces taken out of zone 0 when this zone starts. "*" is every one on a
# bus device (PCI, USB, platform), wireless ones moved by their wiphy; software
# devices (loopback, bridges, veth, tunnels) never qualify. A single name such
# as "eth0" takes only that one.
nic = "*"

[storage]
mode = "ephemeral"
# Required for ephemeral: $HOME is a tmpfs, and its pages outlive the process
# that wrote them, so the cgroup memory limit does not bound them.
size = "512M"

[policy]
seccomp  = "policy/net.seccomp"

[limits]
memory_max = "1G"
pids_max   = 256

[identity]
# Host uid/gid range: root inside maps to 196608, nobody to 262142. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 196608

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# backs up colour for users who cannot tell colours apart. Pick colours with
# `zoneid propose`; `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#686573"
border_pattern = "notched"
glyph          = "◐"
label          = "NET"
