# net — the ONLY zone holding a route to the physical NIC.
#
# Every other zone reaches the network through this one. That makes it a
# chokepoint and a high-value target; it is documented as such in
# docs/architecture.md under "Known weaknesses". Its storage is ephemeral
# precisely because it is the most exposed zone.

[zone]
name        = "net"
description = "Sole holder of a physical network route."

[network]
mode = "nic"
# Zones with mode = "routed" get a veth into kryptik0, the bridge in this zone.
# What this zone takes out of zone 0 when it starts: every interface that
# sits on a bus device (PCI, USB, a platform device) - a server's wired
# ports, a laptop's wireless radio, a dock's USB adapter - wired ones by the
# netdev, wireless ones by their wiphy. Software devices (loopback, bridges,
# veth ends, tunnels) never qualify. A single name such as "eth0" is also
# accepted, for a machine where only one interface should leave zone 0.
nic = "*"

[storage]
mode = "ephemeral"
# Required for ephemeral: $HOME is a tmpfs, and an unbounded tmpfs lets the
# zone consume host memory by writing files - which the cgroup memory limit
# does NOT catch, because those pages outlive the process that wrote them.
size = "512M"

[policy]
seccomp  = "policy/net.seccomp"

[limits]
memory_max = "1G"
pids_max   = 256

[identity]
# Fixed host uid/gid range for this zone: root inside maps to 196608,
# nobody to 262142. Never derived from zone order; see docs/design/privileged-launch.md.
uid_base = 196608

[ui]
# Identity in four channels (compositor/zoneid, `zoneid explain`): the
# colour is from `zoneid propose` (every pair of shipped zones differs by
# dE00 >= 15 under every vision model, 3:1 against both backgrounds);
# the pattern, glyph and label are what remain for a user who cannot see
# the colour difference. Every zone has a distinct value in each.
border_color   = "#686573"
border_pattern = "notched"
glyph          = "◐"
label          = "NET"
