# untrusted — for opening things you do not trust; its network path is assumed hostile.

[zone]
name        = "untrusted"
description = "Unknown files and sketchy links. Wiped on exit."

[network]
mode = "routed"

[storage]
mode = "ephemeral"
# Required for ephemeral: $HOME is a tmpfs, which could otherwise fill host memory.
size = "2G"

[policy]
seccomp  = "policy/untrusted.seccomp"

[limits]
memory_max = "4G"
pids_max   = 512
# Two CPUs' worth of time: what runs here cannot take the whole machine.
cpu_max    = "200%"

[identity]
# Root inside maps to host uid/gid 327680, nobody to 393214; fixed, never derived from zone order.
uid_base = 327680

[ui]
# Colour, glyph and label must be unique; `zoneid propose` picks colours, `zoneid audit` checks.
border_color   = "#ba7c02"
# The pattern is checked, but nothing draws it.
border_pattern = "dash-dot"
glyph          = "▲"
label          = "UNTRUSTED"
