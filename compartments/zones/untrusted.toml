# untrusted — for opening things you do not trust. The isolation exit test
# attacks from this zone; its network path is assumed hostile.

[zone]
name        = "untrusted"
description = "Unknown files and sketchy links. Wiped on exit."

[network]
mode = "routed"
# The network the machine is plugged into, with its router and the page a
# Wi-Fi logs in on: this zone alone reaches it (docs/design/net-zone.md).
local = true

[storage]
mode = "ephemeral"
# Required for ephemeral: $HOME is a tmpfs, and its pages outlive the process
# that wrote them, so the cgroup memory limit does not bound them.
size = "2G"

[policy]
seccomp  = "policy/untrusted.seccomp"

[limits]
memory_max = "4G"
pids_max   = 512
# Two CPUs' worth of time: what runs here cannot take the whole machine.
cpu_max    = "200%"

[identity]
# Host uid/gid range: root inside maps to 327680, nobody to 393214. Fixed,
# never derived from zone order (docs/design/privileged-launch.md).
uid_base = 327680

[ui]
# Colour, glyph and label must differ from every other zone's; the pattern
# is checked but nothing draws it. Pick colours with `zoneid propose`;
# `zoneid audit` checks the set, `zoneid explain` the rule.
border_color   = "#ba7c02"
border_pattern = "dash-dot"
glyph          = "▲"
label          = "UNTRUSTED"
