[package]
name = "kryptikd"
version = "0.1.0"
edition = "2021"
description = "Kryptik compartment manager: zone lifecycle and isolation"
license = "GPL-2.0-or-later"

# kryptikd is the most privileged process on the system, so it depends on
# `libc` alone (ADR-010); anything else, TOML parsing included, is written here.
[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"      # no unwinding through a privileged boundary
strip = true
overflow-checks = true
debug-assertions = false
