[package]
name = "kryptikd"
version = "0.1.0"
edition = "2021"
description = "Kryptik compartment manager: zone lifecycle and isolation"
license = "GPL-2.0-or-later"

# The most privileged process on the system depends on libc alone; even TOML parsing is ours (ADR-010).
[dependencies]
libc = "0.2"

# Set only by cargo fuzz, which builds main.rs from fuzz/Cargo.toml.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"      # no unwinding through a privileged boundary
strip = true
overflow-checks = true
debug-assertions = false
