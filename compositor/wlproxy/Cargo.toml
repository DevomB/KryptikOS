[package]
name = "wlproxy"
description = "kryptik-wlproxy: the per-zone Wayland filtering proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

# libc only (ADR-010): this parses a zone's bytes, and Wayland libraries are built to be permissive.
[dependencies]
libc = "0.2"

[[bin]]
name = "kryptik-wlproxy"
path = "src/main.rs"
