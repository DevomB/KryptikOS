[package]
name = "wlproxy"
description = "kryptik-wlproxy: the per-zone Wayland filtering proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

# Dependency policy (ADR-010): this parses an untrusted zone's bytes, so libc
# only. The wire format is hand-rolled; Wayland libraries are built to be permissive.
[dependencies]
libc = "0.2"

[[bin]]
name = "kryptik-wlproxy"
path = "src/main.rs"
