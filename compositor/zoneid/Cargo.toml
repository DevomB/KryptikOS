[package]
name = "zoneid"
description = "Kryptik zone visual identity: the perceptual distinctness invariant"
version.workspace = true
edition.workspace = true
license.workspace = true

# ZERO dependencies, and not as a badge. This crate decides whether two zones
# are distinguishable to a human, which is the last line of defence in the
# whole architecture (docs/architecture.md: "the only layer that matters - the
# human one"). Colour science implemented from published formulae that can be
# checked against reference values in tests beats a crate nobody in this
# project has read. See ADR-010 for the same argument applied to kryptikd.
[dependencies]

[[bin]]
name = "zoneid"
path = "src/bin/zoneid.rs"
