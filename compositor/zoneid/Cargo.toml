[package]
name = "zoneid"
description = "Kryptik zone visual identity: the perceptual distinctness invariant"
version.workspace = true
edition.workspace = true
license.workspace = true

# No dependencies. This crate decides whether a person can tell two zones
# apart, and colour science from published formulae, checked against
# reference values in tests, beats a crate nobody in this project has read.
# ADR-010 makes the same argument for kryptikd.
[dependencies]

[[bin]]
name = "zoneid"
path = "src/bin/zoneid.rs"
