# Apart from kryptikd's workspace, so no desktop dependency reaches its lockfile (ADR-010).
[workspace]
resolver = "2"
members = ["zoneid", "wlproxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true   # security code; keep these on in release
debug-assertions = false

# zoneid's palette search takes seconds at -O2, minutes unoptimised.
[profile.test]
opt-level = 2
